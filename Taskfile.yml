version: '3'

vars:
  BIN: '{{.ROOT_DIR}}/bin'
  KIT: '{{.ROOT_DIR}}/kit/sbx-warden'
  SERVER_ADDR: '127.0.0.1:7391'

tasks:
  default:
    cmds:
      - task: validate
      - task: test

  build:
    desc: Build both binaries for the host platform into ./bin
    cmds:
      - mkdir -p {{.BIN}}
      - go build -o {{.BIN}}/sbx-warden ./cmd/sbx-warden
      - go build -o {{.BIN}}/sbx ./cmd/sbx

  build:client:
    desc: Cross-build the sbx client for a sandbox (GOOS/GOARCH override the defaults)
    vars:
      GOOS: '{{.GOOS | default "linux"}}'
      GOARCH: '{{.GOARCH | default "arm64"}}'
    cmds:
      - mkdir -p {{.BIN}}
      - GOOS={{.GOOS}} GOARCH={{.GOARCH}} CGO_ENABLED=0 go build -o {{.BIN}}/sbx-{{.GOOS}}-{{.GOARCH}} ./cmd/sbx
      - echo "built {{.BIN}}/sbx-{{.GOOS}}-{{.GOARCH}}"

  build:client:all:
    desc: Cross-build the sbx client for linux/amd64 and linux/arm64
    cmds:
      - task: build:client
        vars: {GOOS: linux, GOARCH: amd64}
      - task: build:client
        vars: {GOOS: linux, GOARCH: arm64}

  install:client:
    desc: Cross-build the client and install it into a sandbox as /usr/local/bin/sbx
    requires:
      vars: [SANDBOX]
    vars:
      GOOS: '{{.GOOS | default "linux"}}'
      GOARCH: '{{.GOARCH | default "arm64"}}'
    cmds:
      - task: build:client
        vars: {GOOS: '{{.GOOS}}', GOARCH: '{{.GOARCH}}'}
      - sbx cp {{.BIN}}/sbx-{{.GOOS}}-{{.GOARCH}} {{.SANDBOX}}:/usr/local/bin/sbx

  catalog:generate:
    desc: Regenerate the embedded sbx command catalog (SANDBOXES overrides the sbx checkout)
    vars:
      SANDBOXES: '{{.SANDBOXES | default "../sandboxes"}}'
    cmds:
      - go run ./cmd/gen-catalog --docs {{.SANDBOXES}}/docs/yml
      - task: policy:schema

  policy:schema:
    desc: Regenerate the Cedar schema documenting the policy vocabulary
    cmds:
      - go run ./cmd/gen-schema

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:race:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  validate:
    desc: Check formatting, vet and module tidiness
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...
      - go mod tidy -diff

  kit:validate:
    desc: Validate the kit and check that every pinned version still agrees
    silent: true
    cmds:
      - |
        set -eu
        declared=$(sed -n 's/^version: "\(.*\)"$/\1/p' {{.KIT}}/spec.yaml)
        pinned=$(sed -n 's/^ *version=v\(.*\)$/\1/p' {{.KIT}}/spec.yaml)
        if [ -z "$declared" ] || [ -z "$pinned" ]; then
          echo "could not read both versions out of {{.KIT}}/spec.yaml" >&2
          exit 1
        fi
        if [ "$declared" != "$pinned" ]; then
          echo "kit declares version $declared but installs client v$pinned" >&2
          exit 1
        fi
        # Documented git references pin the kit by tag, so they go stale on a
        # release unless they move with it. Non-version refs (main, a SHA) are
        # deliberate and not checked.
        for ref in $(grep -o '#ref=v[0-9][0-9.]*' {{.ROOT_DIR}}/README.md | sed 's/^#ref=v//' | sort -u); do
          if [ "$ref" != "$declared" ]; then
            echo "README references kit ref v$ref but the kit is version $declared" >&2
            exit 1
          fi
        done
      - sbx kit validate {{.KIT}}

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build the release archives locally without publishing
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  run:
    desc: Run the server in the foreground against the host's sbx
    cmds:
      - go run ./cmd/sbx-warden --addr {{.SERVER_ADDR}} {{.CLI_ARGS}}

  allow:
    desc: Add the sandbox network policy rule the client needs
    cmds:
      - sbx policy allow network localhost:{{.SERVER_ADDR | splitList ":" | last}}

  clean:
    cmds:
      - rm -rf {{.BIN}}
