# Which policies apply to which sandboxes.
#
# Every binding whose pattern matches the calling sandbox applies, so order does
# not matter: the baseline bound to "*" cannot be skipped by an entry below it.
# Cedar decides the rest — permits accumulate, and a forbid in any matching file
# beats all of them.
#
# A sandbox that matches no binding is granted nothing and is told so, which
# distinguishes "I forgot to bind this sandbox" from "a rule refused".
#
# Policies are named relative to this file, so serving this map over https
# resolves them next to it there rather than on the host that reads it. Patterns
# are globs over the sandbox name: "*" matches any run of characters, "?" a
# single one, and a pattern without a wildcard is an exact name.

bindings:
  # Guardrails and a floor of read-only access for every sandbox.
  - sandboxes: "*"
    policies:
      - baseline.cedar
      - readonly.cedar

  # Sandboxes named worker-something may work on themselves.
  - sandboxes: "worker-*"
    policies: worker.cedar
    groups: workers

  # One named sandbox manages the others.
  - sandboxes: orchestrator
    policies: orchestrator.cedar
    groups: orchestrators

  # Unlimited access, for a sandbox trusted with the host itself. It is left
  # commented out because this map is the default a server fetches when none is
  # given, and being named "root" should not be what confers the host. Enable it
  # for a name you chose, in a map you control.
  #
  # Both lines matter and neither is enough alone: root.cedar grants nothing
  # without the group, and the group on its own lifts the guardrails in
  # baseline.cedar for whatever sandbox holds it.
  #
  # - sandboxes: root
  #   policies: root.cedar
  #   groups: root
