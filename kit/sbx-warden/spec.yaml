schemaVersion: "2"
kind: mixin
name: sbx-warden
version: "0.5.0"
displayName: sbx-warden client
description: |
  Installs the sbx-warden client, which forwards sbx commands to the sbx-warden
  server on the host over TCP. This grants the sandbox the host's Docker
  Sandboxes control plane, which is enough to read and write host files and to
  lift the sandbox's own network policy. Add it only to sandboxes you would
  trust with your host.
sourceURL: https://github.com/cdupuis/sbx-warden
licenses:
  - MIT

permissions:
  network:
    allow:
      - raw.githubusercontent.com
      - github.com
      - release-assets.githubusercontent.com
      # The egress proxy rewrites host.docker.internal to localhost before it
      # evaluates policy, while rules match verbatim, so the server's port has
      # to be allowed under localhost rather than under the name the client
      # dials.
      - localhost:7391

environment:
  variables:
    SBX_WARDEN_ADDR: host.docker.internal:7391

setup:
  install:
    - description: Install the sbx-warden client from its pinned release
      # Downloading the installer instead of piping it into sh keeps a failed
      # fetch fatal: POSIX sh has no pipefail, so a piped installer that never
      # arrives would exit 0 and leave the sandbox without a client.
      command: |
        set -eu
        version=v0.6.0
        installer="$(mktemp)"
        trap 'rm -f "$installer"' EXIT
        curl -fsSL --retry 3 -o "$installer" \
          "https://raw.githubusercontent.com/cdupuis/sbx-warden/${version}/install.sh"
        sh "$installer" --client --version "$version" --dir /usr/local/bin

agentInstructions:
  content: |
    ## sbx

    The `sbx` command in this sandbox is a client for the Docker Sandboxes CLI
    running on the host. Subcommands act on the host's sandboxes, not on this
    one, so `sbx ls` lists sandboxes alongside this one rather than anything
    inside it.

    Authentication comes from `SBX_WARDEN_TOKEN`, which identifies this sandbox to
    the host server. It is set when the sandbox is created, by an operator on the
    host running `sbx-warden grant`. If it is unset, or the server rejects it, that
    is not something to work around from in here: report it, because only the
    host side can grant this sandbox or recreate it.

    The host server may also refuse individual commands by policy, which is a
    decision about this sandbox rather than an error to retry.
